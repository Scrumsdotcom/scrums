name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: cli/package-lock.json
      - name: Install CLI
        working-directory: cli
        run: npm ci || npm install
      - name: Validate manifests, agents, workflows, primitives
        working-directory: cli
        run: npm run validate
      - name: Unit tests
        working-directory: cli
        run: npm test
