name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # better-sqlite3 is a native addon — exercise every supported major.
        node-version: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0   # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e   # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: |
            cli/package-lock.json
            runtime/package-lock.json
      - name: Install CLI
        working-directory: cli
        run: npm ci
      - name: Typecheck (CLI)
        working-directory: cli
        run: npm run typecheck
      - name: Validate manifests, agents, workflows, primitives
        working-directory: cli
        run: npm run validate
      - name: Unit tests (CLI)
        working-directory: cli
        run: npm test

      - name: Install runtime host
        working-directory: runtime
        run: npm ci
      - name: Typecheck (runtime host)
        working-directory: runtime
        run: npm run typecheck
      - name: Unit tests (runtime host)
        working-directory: runtime
        run: npm test
      - name: Runtime host smoke — load the manifest graph
        working-directory: runtime
        run: npx tsx src/index.ts load --repo ..
