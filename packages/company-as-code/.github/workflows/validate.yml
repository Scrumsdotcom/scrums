name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd   # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e   # v6.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            cli/package-lock.json
            runtime/package-lock.json
      - name: Install CLI
        working-directory: cli
        run: npm ci
      - name: Validate manifests, agents, workflows, primitives
        working-directory: cli
        run: npm run validate
      - name: Unit tests (CLI)
        working-directory: cli
        run: npm test

      - name: Install runtime host
        working-directory: runtime
        run: npm ci
      - name: Unit tests (runtime host)
        working-directory: runtime
        run: npm test
      - name: Runtime host smoke — load the manifest graph
        working-directory: runtime
        run: npx tsx src/index.ts load --repo ..
