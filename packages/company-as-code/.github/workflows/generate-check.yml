name: generate-check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: cli/package-lock.json
      - name: Install CLI
        working-directory: cli
        run: npm ci || npm install
      - name: Run drift gate
        working-directory: cli
        run: npm run generate:check
