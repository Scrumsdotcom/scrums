name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly Monday at 04:00 UTC — keep findings fresh even when no PRs land.
    - cron: "0 4 * * MON"

permissions:
  contents: read
  security-events: write    # CodeQL writes findings into the Security tab
  actions: read             # CodeQL inspects workflow runs for context
  pull-requests: read       # gitleaks lists the PR's commits to scope the scan (comments stay disabled)

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0   # v7.0.0
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e   # v3.0.0
        # This step is BLOCKING: a secret hit fails the workflow. PR comments
        # are disabled (they need GitHub Advanced Security on private repos
        # and a `pull-requests: write` grant) so annotation-API failures
        # can't mask a real finding behind a green check.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  dependency-audit:
    name: npm audit (cli + runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0   # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e   # v6.4.0
        with:
          node-version: "20"
      - name: Audit CLI dependencies
        working-directory: cli
        # Production-only audit; high or critical findings fail the job.
        # Forks may tighten to --audit-level=moderate once the dependency
        # tree stabilizes.
        run: npm audit --omit=dev --audit-level=high
      - name: Audit runtime dependencies
        working-directory: runtime
        run: npm audit --omit=dev --audit-level=high

  codeql:
    name: CodeQL (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    # CodeQL writes to the Security tab via `security-events: write`. On
    # private repos this requires GitHub Advanced Security (paid feature).
    # Skip entirely when the repo is private — running and failing on
    # every PR produces noise without value. Forks running on public
    # repos or with GHAS enabled get full CodeQL coverage automatically.
    if: github.event.repository.private == false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0   # v7.0.0
      - name: Initialize CodeQL
        uses: github/codeql-action/init@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a   # v4.36.3
        with:
          languages: javascript-typescript
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e   # v4.36.2
        with:
          category: "/language:javascript-typescript"
