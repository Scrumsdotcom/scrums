name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly Monday at 04:00 UTC — keep findings fresh even when no PRs land.
    - cron: "0 4 * * MON"

permissions:
  contents: read
  security-events: write    # CodeQL writes findings into the Security tab
  pull-requests: write      # gitleaks posts PR annotations on findings
  actions: read             # CodeQL inspects workflow runs for context

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0   # v7.0.0
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e   # v2.3.6
        # gitleaks-action calls the GitHub API to post annotations. On private
        # repos without GitHub Advanced Security the call returns 403. Treat
        # API-permission failures as non-blocking; the scan itself still runs
        # and exits non-zero on a true secret hit. Forks with GHAS enabled
        # should remove `continue-on-error`.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: npm audit (cli + runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0   # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e   # v6.4.0
        with:
          node-version: "20"
      - name: Audit CLI dependencies
        working-directory: cli
        # Production-only audit; high or critical findings fail the job.
        # Forks may tighten to --audit-level=moderate once the dependency
        # tree stabilizes.
        run: npm audit --omit=dev --audit-level=high
      - name: Audit runtime dependencies
        working-directory: runtime
        run: npm audit --omit=dev --audit-level=high

  codeql:
    name: CodeQL (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    # CodeQL writes to the Security tab via `security-events: write`. On
    # private repos this requires GitHub Advanced Security (paid feature).
    # Skip entirely when the repo is private — running and failing on
    # every PR produces noise without value. Forks running on public
    # repos or with GHAS enabled get full CodeQL coverage automatically.
    if: github.event.repository.private == false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0   # v7.0.0
      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e   # v4.36.2
        with:
          languages: javascript-typescript
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e   # v4.36.2
        with:
          category: "/language:javascript-typescript"
