name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly Monday at 04:00 UTC. Keep findings fresh even when no PRs land.
    - cron: "0 4 * * MON"

permissions:
  contents: read
  security-events: write    # CodeQL writes findings into the Security tab
  actions: read             # CodeQL inspects workflow runs for context
  pull-requests: read       # gitleaks lists the PR's commits to scope the scan (comments stay disabled)

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e   # v3.0.0
        # This step is BLOCKING: a secret hit fails the workflow. PR comments
        # are disabled (they need GitHub Advanced Security on private repos
        # and a `pull-requests: write` grant) so annotation-API failures
        # can't mask a real finding behind a green check.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  dependency-audit:
    name: npm audit (cli + runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version: "22"
      - name: Audit CLI dependencies
        working-directory: cli
        # Production-only audit; high or critical findings fail the job.
        # Forks may tighten to --audit-level=moderate once the dependency
        # tree stabilizes.
        run: npm audit --omit=dev --audit-level=high
      - name: Audit runtime dependencies
        working-directory: runtime
        run: npm audit --omit=dev --audit-level=high

  codeql:
    name: CodeQL (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    # CodeQL writes to the Security tab via `security-events: write`. On
    # private repos this requires GitHub Advanced Security (paid feature).
    # Skip entirely when the repo is private, running and failing on
    # every PR produces noise without value. Forks running on public
    # repos or with GHAS enabled get full CodeQL coverage automatically.
    if: github.event.repository.private == false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370   # v4.39.1
        with:
          languages: javascript-typescript
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370   # v4.39.1
        with:
          category: "/language:javascript-typescript"
