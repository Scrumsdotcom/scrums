name: scorecard

# OpenSSF Scorecard measures the supply-chain posture of the repository
# itself: branch protection, pinned actions, dependency update automation,
# secret scanning, and so on. It is the same argument this framework makes
# about companies, applied to the repository that makes it.

on:
  branch_protection_rule:
  schedule:
    - cron: "0 5 * * MON"
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # Results are written to the Security tab, which needs the repository to
    # be public. Skip on private forks rather than failing every run.
    if: github.event.repository.private == false
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e   # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload results to the Security tab
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370   # v4.39.1
        with:
          sarif_file: results.sarif
