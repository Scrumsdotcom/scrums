apiVersion: company-as-code/v1
kind: Agent

name: finance-ops-roll-up
module: company/executive/finance-ops

purpose: >
  Aggregate the finance-ops domain's state (ledger summary, workforce
  state, compliance state) into the finance-rollup payload consumed by
  the CEO cognition node.

runtime: llm
schedule: "0 5 * * MON"
cadence: weekly
autonomy: autonomous

inputs:
  - name: ledger-summary
    type: ledger-summary
    from: company/domains/finance-ops/finance:ledger-summary
  - name: workforce-state
    type: workforce-state
    from: company/domains/finance-ops/people:workforce-state
  - name: compliance-state
    type: compliance-state
    from: company/domains/finance-ops/governance:compliance-state

outputs:
  - name: finance-rollup
    type: finance-rollup

tools:
  - canonical-ledger-reader

memoryScope: company/memory/finance-ops-roll-up

observability:
  dashboards:
    - executive-overview
  alerts: []
  auditTopic: finance-ops-roll-up

invariants:
  - Reads only from declared consumes-interfaces.
  - Read-only; never writes to external systems.

contacts:
  - role: accountable
    person: cfo
