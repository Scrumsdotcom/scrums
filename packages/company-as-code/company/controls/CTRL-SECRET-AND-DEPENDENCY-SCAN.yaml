apiVersion: company-as-code/v1
kind: Control

id: CTRL-SECRET-AND-DEPENDENCY-SCAN
title: Credentials and vulnerable dependencies are blocked at the merge boundary
description: >
  Every pull request and every push to the default branch runs a blocking
  secret scan and a production-dependency audit, plus static analysis on
  public repositories. A finding fails the workflow rather than annotating it,
  so a broken annotation API cannot hide a real hit behind a green check.

implements:
  - REQ-GDPR-ART-32

owner:
  kind: module
  id: company/domains/product-operations/security

verification:
  method: automated
  surface: ci
  check: .github/workflows/security.yml
  frequency: on-change
  failureMode: Fails the workflow and blocks the merge.

evidence:
  - source: ci-run
    reference: .github/workflows/security.yml
    retention: P1Y

severity: high
status: operating
lastVerified: 2026-08-16
