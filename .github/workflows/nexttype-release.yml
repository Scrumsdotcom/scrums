name: nexttype-release

# Runs when a maintainer pushes a NextType version tag such as nexttype-v0.1.0.
# The nexttype- prefix keeps these tags apart from the monthly vYYYY.MM tags.
# Builds from the tagged commit, runs the full test suite, writes SHA256SUMS,
# attests build provenance with Sigstore, and creates a draft GitHub release.
# A maintainer reviews the draft before publishing it.

on:
  push:
    tags: ["nexttype-v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: nexttype
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check that the tag matches the package version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#nexttype-v}"
          pkg=$(node -p 'require("./packages/compiler/package.json").version')
          if [ "$tag" != "$pkg" ]; then echo "tag $tag does not match package version $pkg" >&2; exit 1; fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - name: Build and test
        working-directory: nexttype/packages/compiler
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
      - name: Package
        env:
          SOURCE_DATE_EPOCH: "315532800"
        run: |
          mkdir -p dist-release
          (cd packages/compiler && npm pack --pack-destination ../../dist-release)
          cp cli/nt cli/install.sh dist-release/
          cd dist-release
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            nexttype/dist-release/*.tgz
            nexttype/dist-release/nt
            nexttype/dist-release/install.sh
            nexttype/dist-release/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: nexttype/dist-release/
          if-no-files-found: error

  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist-release
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist-release/* \
            --repo "$GITHUB_REPOSITORY" --draft --verify-tag --latest=false \
            --title "NextType $VERSION" \
            --notes "See nexttype/CHANGELOG.md. Verify a download with: gh attestation verify FILE --repo $GITHUB_REPOSITORY"
