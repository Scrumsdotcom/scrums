name: company-as-code-generate-check

# Mirrors the upstream drift gate: generated files in
# packages/company-as-code/generated/ must match their sources.

on:
  pull_request:
    paths:
      - "packages/company-as-code/**"
      - ".github/workflows/company-as-code-generate-check.yml"
  push:
    branches: [main]
    paths:
      - "packages/company-as-code/**"
      - ".github/workflows/company-as-code-generate-check.yml"

permissions:
  contents: read

concurrency:
  group: company-as-code-generate-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/company-as-code/cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install CLI (lockfile only, no install scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run drift gate
        run: npm run generate:check
