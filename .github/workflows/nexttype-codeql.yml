name: nexttype-codeql

on:
  pull_request:
    paths:
      - "nexttype/**"
      - ".github/workflows/nexttype-*.yml"
  push:
    branches: [main]
    paths:
      - "nexttype/**"
      - ".github/workflows/nexttype-*.yml"
  schedule:
    - cron: "41 4 * * 3"

permissions:
  contents: read

jobs:
  analyze:
    # Code scanning needs a public repository or GitHub Advanced Security.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          # Scan NextType and its workflows only.
          config: |
            paths:
              - nexttype
              - .github/workflows/nexttype-*.yml
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: nexttype-${{ matrix.language }}
