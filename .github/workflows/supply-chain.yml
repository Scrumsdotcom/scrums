name: supply-chain

# Repository supply-chain policy: pinned and least-privilege workflows,
# registry-only lockfiles with integrity hashes, an install-script allowlist,
# a denylist of known-malicious npm versions, no auto-run editor or agent
# configuration, and reviewed docs scripts only.
# See .github/scripts/supply-chain-check.mjs. The weekly run re-checks the
# lockfiles against new denylist entries.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "11 5 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Test the policy check
        run: node --test .github/scripts/supply-chain-check.test.mjs
      - name: Check the repository
        run: node .github/scripts/supply-chain-check.mjs
