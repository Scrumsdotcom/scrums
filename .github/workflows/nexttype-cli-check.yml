name: nexttype-cli-check

on:
  pull_request:
    paths:
      - "nexttype/cli/**"
      - "nexttype/tests/cli.sh"
      - ".github/workflows/nexttype-cli-check.yml"
  push:
    branches: [main]
    paths:
      - "nexttype/cli/**"
      - "nexttype/tests/cli.sh"
      - ".github/workflows/nexttype-cli-check.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexttype
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show shellcheck version
        run: shellcheck --version
      - name: Test the preview CLI and installer
        run: sh tests/cli.sh
