name: scorecard

# OpenSSF Scorecard: checks this repository against supply-chain security
# practices (pinned dependencies, token permissions, branch protection,
# dangerous workflow patterns, and more). Results go to the code scanning
# tab and to the public Scorecard API. The Scorecard API accepts published
# results only from a workflow of this shape: one job, read permissions,
# and the approved actions only.

on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: "23 5 * * 2"
  workflow_dispatch: {}

permissions: {}

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write # uploads the SARIF results
      id-token: write # signs the results published to the Scorecard API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: scorecard.sarif
          category: scorecard
