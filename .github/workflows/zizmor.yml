name: zizmor

# Static analysis of the GitHub Actions workflows with zizmor: template
# injection, dangerous triggers, credential persistence, cache poisoning,
# excessive permissions, and unpinned actions. Findings go to the code
# scanning tab and annotate the pull request.

on:
  pull_request:
    paths:
      - ".github/**"
  push:
    branches: [main]
    paths:
      - ".github/**"
  schedule:
    - cron: "37 4 * * 1"

permissions: {}

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write # uploads the SARIF results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.31.1
          # The workflows in packages/company-as-code/.github/ belong to the
          # upstream project and do not run here.
          inputs: .github
