name: fuzz

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      runs:
        description: Number of streams
        default: "500000"
      seed:
        description: Seed (empty for a time-based seed)
        default: ""

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: packages/compiler
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Fuzz the checker
        run: node dist/test/fuzz.js
        env:
          NT_FUZZ_RUNS: ${{ inputs.runs || '500000' }}
          NT_FUZZ_SEED: ${{ inputs.seed }}
