<text x="76" y="300" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#bcd0ff">Agents write the code. The checker checks the contract.</text>
<g font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
<rect x="808" y="120" width="400" height="196" rx="3" fill="#0d1a3d" stroke="#1b2a52"/>
<text x="828" y="152" fill="#bcd0ff">; context: n:N, xs:V Z n</text>
<text x="828" y="180" fill="#ffffff">c0 (sig t Z (= t (sum xs)))</text>
<text x="828" y="204" fill="#ffffff">f0 (pair (sum xs) refl)</text>
<text x="828" y="228" fill="#ffffff">put f0 c0 @b0</text>
<text x="828" y="252" fill="#ffffff">ck f0 @a0</text>
<text x="828" y="290" fill="#7fa8ff">proved o0 TY f0</text>
</g>
